name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      # Cache the nix store to avoid rebuilding zig/mariadb/etc on every run
      - uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-

      # Verify the flake evaluates and unit tests pass in a pure sandbox
      - name: Flake check (unit tests)
        run: nix flake check

      # Run the full test suite inside the devShell where all tools are on PATH:
      # test-unit → test-serve → test-integration (MariaDB) → test-sync → test-mariadb-cli
      - name: Full test suite
        run: nix develop --command test-all
